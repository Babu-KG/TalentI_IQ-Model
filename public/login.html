<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TalentIQ — Sign in</title><link rel="stylesheet" href="/styles.css"></head>
<body><main style="min-height:100vh;display:grid;place-items:center;padding:24px">
<section style="width:min(460px,100%);border:1px solid #333;background:#101010;padding:38px">
<div class="eyebrow">TALENTIQ ACCESS</div><h1 style="font-size:44px;letter-spacing:-2px">Welcome back.</h1>
<p style="color:#999">Enter your email and we'll send you a secure 6-digit sign-in code.</p>
<form id="form"><input id="email" type="email" autocomplete="username webauthn" required placeholder="you@example.com" style="width:100%;padding:14px;background:#181818;color:#fff;border:1px solid #333;margin:18px 0 10px"><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" style="display:none;width:100%;padding:14px;background:#181818;color:#fff;border:1px solid #333;margin:0 0 10px"><button id="go" class="primary" style="width:100%" type="submit">Continue</button></form>
<button id="passkey" class="ghost" style="display:none;width:100%;margin-top:10px">Use passkey</button><p id="msg" style="color:#999;font-size:13px;margin-top:16px"></p>
</section></main>
<script>
const A=window.hatchable.auth,email=document.getElementById("email"),code=document.getElementById("code"),go=document.getElementById("go"),pk=document.getElementById("passkey"),msg=document.getElementById("msg");let sent=false,hasPasskey=false;
function next(){const n=new URLSearchParams(location.search).get("next");return n&&n.startsWith("/")?n:"/";}
A.getSession().then(s=>{if(s&&s.user)location.href=next();});
document.getElementById("form").onsubmit=async e=>{e.preventDefault();msg.textContent="";try{if(!sent){const r=await A.startLogin({email:email.value.trim()});hasPasskey=!!r.has_passkey;if(hasPasskey&&A.supportsPasskeys()){pk.style.display="block";try{const done=await A.signInWithPasskey({email:email.value.trim()});if(done.user)location.href=next();return;}catch{}}code.style.display="block";go.textContent="Sign in";sent=true;msg.textContent="Code sent. Check your email.";}else{const done=await A.verifyCode({email:email.value.trim(),code:code.value.trim()});if(done.user)location.href=next();}}catch(err){msg.textContent=err.message||"Sign-in failed. Please try again.";}};pk.onclick=async()=>{try{const done=await A.signInWithPasskey({email:email.value.trim()});if(done.user)location.href=next();}catch(err){msg.textContent=err.message||"Passkey sign-in cancelled.";}};</script></body></html>
