<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TalentIQ — Sign in</title><link rel="stylesheet" href="/styles.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:24px"><section style="width:min(440px,100%);border:1px solid #333;background:#101010;padding:36px"><div class="eyebrow">TALENTIQ ACCESS</div><h1 style="font-size:42px;letter-spacing:-2px">Welcome back.</h1><p style="color:#999">Sign in with your email. No password needed.</p><input id="email" type="email" placeholder="you@example.com" style="width:100%;padding:14px;background:#181818;color:#fff;border:1px solid #333;margin:18px 0"><input id="code" inputmode="numeric" placeholder="6-digit code" style="display:none;width:100%;padding:14px;background:#181818;color:#fff;border:1px solid #333;margin:0 0 10px"><button id="go" class="primary" style="width:100%">Continue</button><p id="msg" style="color:#999;font-size:13px;margin-top:16px"></p></section></main><script>const A=window.hatchable.auth;const email=document.getElementById("email"),code=document.getElementById("code"),go=document.getElementById("go"),msg=document.getElementById("msg");let step=0;A.getSession().then(s=>{if(s&&s.user)location.href=new URLSearchParams(location.search).get("next")||"/";});go.onclick=async()=>{try{if(!step){await A.startLogin({email:email.value});step=1;code.style.display="block";go.textContent="Sign in";msg.textContent="Check your email for the code.";return}const r=await A.verifyCode({email:email.value,code:code.value});if(r.user)location.href=new URLSearchParams(location.search).get("next")||"/";}catch(e){msg.textContent=e.message||"Sign-in failed. Try again.";}};</script></body></html>
