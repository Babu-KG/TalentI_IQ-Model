<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TalentIQ Dashboard</title><link rel="stylesheet" href="/styles.css"></head><body><nav><div class="brand">TALENT<span>IQ</span></div><button id="out" class="ghost">Sign out</button></nav><main style="padding:60px 8%;max-width:1200px;margin:auto"><div class="eyebrow">TALENTIQ WORKSPACE</div><h1 id="hello" style="font-size:clamp(44px,7vw,84px);letter-spacing:-4px">Dashboard</h1><div id="cards" class="grid"><article class="card"><h3>Profile</h3><p id="profile">Loading…</p></article><article class="card"><h3>Assessments</h3><p id="assess">Loading…</p></article><article class="card"><h3>Jobs</h3><p id="jobs">Loading…</p></article></div><section class="section" style="padding-left:0;padding-right:0"><div class="sectionhead"><span>OPPORTUNITIES</span><h2>Available jobs</h2></div><div id="list" class="grid"></div></section></main><script>const A=window.hatchable.auth;async function boot(){const s=await A.getSession();if(!s||!s.user){location.href="/login?next=/dashboard";return}hello.textContent="Welcome, "+(s.user.name||s.user.email);const p=await fetch("/api/me").then(r=>r.json());profile.textContent=p.profile?(p.profile.skills?.length||0)+" skills · "+(p.profile.education||"Education not added"):"Complete your profile";assess.textContent=(p.assessments||[]).length+" assessment results";const j=await fetch("/api/jobs").then(r=>r.json());jobs.textContent=(j.jobs||[]).length+" opportunities";list.innerHTML=(j.jobs||[]).slice(0,12).map(x=>'<article class="card"><h3>'+String(x.title).replace(/</g,"&lt;")+'</h3><p>'+String(x.description).slice(0,180).replace(/</g,"&lt;")+'</p><button class="primary" onclick="apply(\''+x.id+'\')">Apply</button></article>').join("")||'<p>No jobs yet.</p>'}async function apply(id){const r=await fetch("/api/student-tools",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"apply",job_id:id})});const d=await r.json();alert(d.error||"Application submitted!")}out.onclick=async()=>{await A.signOut();location.href="/"};boot();</script></body></html>
