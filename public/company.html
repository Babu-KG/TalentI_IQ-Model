<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TalentIQ — Company</title><link rel="stylesheet" href="/styles.css"></head><body><nav><div class="brand">TALENT<span>IQ</span></div><div class="navlinks"><a href="/">Home</a><a href="/student">Student</a><a href="/company">Company</a><a href="/college">College</a><a href="/assessments">Assessments</a></div><button class="ghost" data-signout>Sign out</button></nav><main class="portal"><div id="companyOnboard" class="card" hidden><div class="eyebrow">COMPANY SETUP</div><h1>Create your company workspace.</h1><form id="companyForm"><input id="companyName" placeholder="Company name" required><button class="primary" type="submit">Continue</button></form></div><div id="companyApp"><div class="eyebrow">02 / COMPANY</div><h1>Hire for real capability.</h1><p class="msg">Workspace: <span id="companyNameLabel"></span></p><section class="section"><div class="sectionhead"><span>CREATE</span><h2>Post a job.</h2></div><form id="jobForm" class="card"><input id="jobTitle" placeholder="Job title" required><textarea id="jobDescription" placeholder="Describe responsibilities and required skills: Python, SQL, ML..." required></textarea><div class="weights"><label>Skill % <input id="wSkill" type="number" value="40" min="0" max="100"></label><label>Experience % <input id="wExp" type="number" value="25" min="0" max="100"></label><label>Projects % <input id="wProj" type="number" value="20" min="0" max="100"></label><label>Education % <input id="wEdu" type="number" value="15" min="0" max="100"></label></div><button class="primary" type="submit">Publish job</button><span id="jobMsg" class="msg"></span></form></section><section class="section"><div class="sectionhead"><span>HIRING</span><h2>Your jobs.</h2></div><div id="companyJobs" class="grid"></div><div id="candidateList" class="section" style="padding-left:0;padding-right:0"></div></section></div></main><script src="/portal.js"></script></body></html>
